name: Appium 300 Mobile Tests Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install Appium & Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Backend Dependencies & Start FastAPI
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Build Flutter APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --debug

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            echo "Waiting for FastAPI backend on port 8000..."
            for i in {1..30}; do
              if curl -s http://localhost:8000/ > /dev/null; then
                echo "Backend is ready!"
                break
              fi
              sleep 2
            done

            echo "Installing Appium Test Suite Dependencies..."
            cd appium-tests
            npm ci || npm install
            
            echo "Executing 300 Appium Mobile Tests..."
            npm test

      - name: Upload Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: appium-tests/reports/appium-report.xlsx
