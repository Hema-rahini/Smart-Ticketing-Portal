name: Selenium 300 Tests Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Install Selenium Tests Dependencies
        run: |
          cd selenium-tests
          npm ci || npm install

      - name: Start FastAPI Backend Server
        run: |
          cd backend
          source venv/bin/activate
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Start Next.js Frontend Server
        run: |
          cd frontend
          nohup npm run dev > frontend.log 2>&1 &

      - name: Wait for Servers to be Ready
        run: |
          echo "Waiting for FastAPI backend on port 8000..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            sleep 2
          done

          echo "Waiting for Next.js frontend on port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/ > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            sleep 2
          done

      - name: Run 300 Selenium Tests
        run: |
          cd selenium-tests
          npm test

      - name: Upload Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: selenium-tests/reports/selenium-report.xlsx
