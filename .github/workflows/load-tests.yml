name: Mobile & Backend Load Performance Tests Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # Weekly Sunday 2:00 AM load scan

jobs:
  load-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Backend Dependencies & Start FastAPI
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Wait for FastAPI Backend
        run: |
          echo "Waiting for FastAPI backend on port 8000..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            sleep 2
          done

      - name: Run 100 Load & Performance Tests
        run: |
          cd load-tests
          npm ci || npm install
          npm test

      - name: Upload Excel Load Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: load-tests/reports/load-report.xlsx
